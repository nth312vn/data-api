[project]
name = "data-api"
version = "0.1.0"
description = "Production-grade FastAPI backend scaffold"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.2",
    "asyncpg>=0.29.0",
    "email-validator>=2.2.0",
    "fastapi>=0.111.0",
    "greenlet>=3.0.3",
    "bcrypt>=4.0.1",
    "pydantic-settings>=2.3.4",
    "pyjwt>=2.8.0",
    "sqlalchemy[asyncio]>=2.0.31",
    "trino>=0.329.0",
    "uvicorn[standard]>=0.30.1",
]

[project.optional-dependencies]
dev = [
    "black>=24.4.2",
    "httpx>=0.27.0",
    "mypy>=1.10.1",
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "N", "S"]
ignore = ["B008", "S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = ["alembic/versions"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
